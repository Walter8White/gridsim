[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gridsim"
version = "0.1.0"
description = "Simulation foundations for a modular facade renovation grid"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "PyYAML>=6.0,<7",
  "websockets>=12,<16",
  "bleak>=0.21,<1",
]

[project.optional-dependencies]
station = ["PySide6-Essentials>=6.6,<7", "zaber-motion>=10,<11", "pyserial>=3.5,<4"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["gridsim_core*", "gridsim_sensors*", "gridsim_estimation*", "gridsim_ifc*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = [
  "-p", "no:launch_testing",
  "-p", "no:launch_ros",
]
